# Feature registry (§7.2): the ONLY place a sign convention, default weight,
# winsorization bound, NAICS selection, pleasant-day definition — or, since
# ADR 0003, a user-facing label — lives. Loaded as a typed object; every
# scoring-referenced feature must exist here, every entry must carry complete
# provenance (asserted at build), and every entry must carry display_name,
# unit and definition (asserted at load) so no rendered label lives in code.
# Terminology (§12.3 + ADR 0003/0004): no display field may contain "odds",
# "rival", "market", "supply", "inventory" or "competitor" — asserted at
# load. Internal keys (size_vs_odds and its pool_plus_balance_mass) do not
# change; m3.0.0 (ADR 0009) renames the PILLAR balance -> match.
version: 5

normalization:
  winsor_percentiles: [1, 99]      # extensive quantities, per query
  extensive: "winsorize -> log10 -> min-max across the ranked set for this query"
  intensive: "percentile rank across the ranked set for this query"

# Six pillars since m2.1.0 (Phase 2d item 4): the old lifestyle pillar
# split into weather and students so each gets its own importance control.
# The old lifestyle 0.10 divides in the proportion its two features
# already carried inside it (pleasant days 0.6, students 0.4), so at
# default settings the split reproduces m2.0.0 scoring exactly (asserted
# against a pinned snapshot). control_subtitle is the one-line caption
# under each importance control.
pillars:                            # default weights, sum to 1
  pool:
    default_weight: 0.30
    display_name: "Dating pool size"
    # Phase 2f item 8.3 (Nathan's copy, verbatim): also the What-we-measure
    # card body for this measure
    definition: "How many people here match what you're looking for"
  # m3.0.0 (ADR 0009): the slider's second pole. Balance stops being a
  # pillar and stays as a displayed statistic (pool_balance below, weight
  # 0). The definition is Nathan's, verbatim — also the What-we-measure
  # card body and the stat's subheading.
  match:
    default_weight: 0.25
    display_name: "Chances of matching"
    definition: >-
      How closely the people who match your search resemble the people who
      actually pair with someone like you, on age, education and
      background, where 100 is the US average
  reach:
    default_weight: 0.20
    display_name: "Social life"
    definition: "Places to go out, and how walkable daily life is."
    control_subtitle: "bars, cafés and restaurants, and walkable streets"
  cost:
    default_weight: 0.15
    display_name: "Cost of living"
    definition: "What living here costs — rent and everyday prices."
    control_subtitle: "rent and everyday prices"
  weather:
    default_weight: 0.06
    display_name: "Weather"
    definition: "Mild, dry days a year."
    control_subtitle: "mild, dry days a year"
  students:
    default_weight: 0.04
    display_name: "Student life"
    definition: "How many college students live there."
    control_subtitle: "how many college students live there"

size_vs_odds:                       # internal key unchanged; the control is
  # "Dating pool size vs chances of matching" since m3.0.0 (ADR 0009;
  # ADR 0004's balance pole before that). One scalar divides the
  # people-mass: s=0 all on pool size, s=1 all on chances of matching.
  # The pole labels are Nathan's, verbatim, and ship to the panel through
  # /v1/meta (the panel types no pole wording).
  pool_plus_balance_mass: 0.55
  default_s: 0.4545                 # reproduces the 0.30/0.25 defaults
  label_low: "Dating pool size"
  label_high: "Chances of matching"

# The three-step home-page controls (ADR 0004), FOUR of them since m2.1.0:
# cost, reach (Social life), students, weather. "Not much" is a small
# floor, not zero: nothing showed zeroing a pillar leaves the ranking
# sane, and a floor keeps every stat's effect explainable. The frontend
# sends the level names; this table is the only place they become numbers.
importance_levels:
  not_much: 0.4
  some: 1.0
  a_lot: 2.0

# Five-band standing across ALL 387 cities (Phase 2d item 6), cut on
# national quintiles at build time. A feature with band_edges bands by
# ABSOLUTE value instead (population's case). Labels are per-feature and
# purely POSITIONAL; whether a position is good, bad or neither comes
# from that feature's band_direction, never from the position itself —
# cheap rent is good and a big student share is neither.
standing_bands:
  edges: [20, 40, 60, 80]
  keys: [lowest, low, mid, high, highest]

# The v3 city-page cards, in board order. who_lives_here and
# everyday_prices are display stats (never scored).
city_cards: [rent_1br, everyday_prices, venues_per_100k,
             resident_walkability_index, pleasant_days,
             students_per_1k_adults, who_lives_here]

# Per-statistic ranking pages (Phase 2d item 9): every STATIC statistic,
# served from a build-time JSON over the 193-city ranked set. Never
# matches or balance (both depend on the visitor's search) and never
# crime (the FBI's caution — it gets an explainer page instead).
stat_pages: [rent_1br, everyday_prices, venues_per_100k,
             resident_walkability_index, pleasant_days,
             students_per_1k_adults, who_lives_here]

# Crime context (Phase 2d item 5; D01: never scored). year is the served
# reference year, chosen from the pull's own coverage-by-year table:
# 2025 is the latest complete year AND the best-covered (372 of 387
# metros clear the floor; the 2021 transition year managed 295).
# coverage_floor: below this share of the metro's population in
# full-year-reporting agencies, the blank state renders instead of a
# figure (at 0.6, 15 metros blank in 2025 — New Orleans squeaks by at
# 0.61, which is the number doing its job). The implausibility bars name
# the NIBRS transition failure mode: an agency over the population bar
# whose whole year of "reported" months sums below BOTH offence bars
# (New York City's 2021 submissions put its violent rate under 2 per
# 100k; Orlando filed twelve literal zeros for 2024 and 2025) is counted
# as not reporting — 13 agency-years excluded, each named in the build
# report.
crime:
  year: 2025
  coverage_floor: 0.6
  implausible_min_pop: 100000
  implausible_violent_per_100k: 10
  implausible_property_per_100k: 100

# The race and ethnicity control (m2.2.0, ADR 0006): EIGHT equal groups,
# one rule — the selection is the filter, nothing added, and zero or all
# eight ticked means everyone. Labels live here so the panel types
# nothing; order is the panel's order. These are the ACS race/ethnicity
# categories the cube carries (ADR 0001).
race_groups:
  - {id: hispanic, label: "Hispanic"}
  - {id: white_nh, label: "White"}
  - {id: black_nh, label: "Black"}
  - {id: asian_nh, label: "Asian"}
  - {id: aian_nh, label: "Native American"}
  - {id: nhpi_nh, label: "Pacific Islander"}
  - {id: two_or_more_nh, label: "Two or more races"}
  - {id: other_nh, label: "Another race"}

# Registry-owned interface strings new in Phase 2d (the ground rule made
# explicit: every new user-facing string lives here, not in code).
strings:
  # Phase 2f: Nathan's line-by-line copy, verbatim (his blocks mix
  # American and British forms — "favors" beside the site's older
  # "stabilised" — and both ship as given, noted in PHASE2F.md).
  home_title: "Which city has the best dating scene for you?"
  home_subtitle: >-
    Select who you're looking for and what matters to you. Find out how
    many people match your search in each city based on Census data.
  # m3.0.0 (ADR 0009): Nathan's wording, verbatim
  slider_info: >-
    Leaning towards size favors larger cities with the most possible
    matches. Leaning towards chances of matching favors cities where the
    people who match your search line up more closely with you on age,
    education, and background, based on historical Census marriage data.
  # the chances-of-matching information box (Nathan's, verbatim) and the
  # plain-words account of the kernel it links to (registry-owned; also
  # the methodology page's section). The account names all three inputs
  # in one sentence and register — what it is built from, what it
  # measures, and that it is an aggregate pattern rather than a statement
  # about an individual.
  match_info: >-
    This compares the people who match your search against the pattern of
    who actually forms couples in Census data: the age gaps, the education
    pairings and the racial and ethnic pairings that occur. A higher number
    means the people here are more like the people who typically pair with
    someone in your situation.
  match_how: >-
    The chances-of-matching figure is built from real couples in the Census
    Bureau's household survey, using each partner's age, education and race
    or ethnicity. Across the whole country we measure how often each age
    gap, each education pairing and each racial or ethnic pairing actually
    occurs, compared with how often it would occur if single people paired
    at random. That pattern, adjusted a little for each city's own couples,
    is then applied to the single people who match your search in each
    city, so the figure says how closely they resemble the people who
    typically pair with someone of your sex, age, education and
    background. It is an aggregate pattern from recent unions, not a
    prediction about any one person, and 100 is the US average for your
    search.
  match_how_link: "How this is measured"
  match_unit_line: "where 100 is the US average"
  # m3.1.0 (Phase 3b, A3): the DISPLAY ceiling for chances of matching
  # and the token appended above it. Presentational only: the feature is
  # percentile-ranked, so no score, rank, standing or band reads the
  # display (asserted in the engine tests); a figure above the ceiling
  # renders as the ceiling plus the token and the band label carries
  # the rest. The compare table shows no difference against a capped
  # figure.
  match_display_cap: "250"
  match_display_cap_token: "+"
  # m3.2.0 (Phase 3b, B3): the one sentence a same-sex search carries in
  # its information box, saying whose pairing patterns the figure is
  # built from. The API serves the first when the shipped kernel carries
  # same-sex terms (naming which components they cover) and the second
  # when every component falls back to opposite-sex couples.
  match_same_sex_note: >-
    For a same-sex search the age gaps come from same-sex couples in the
    same survey; the education pairings and the racial and ethnic
    pairings are borrowed from opposite-sex couples, because the same-sex
    couples in the survey do not support a dependable measure of them on
    their own.
  match_same_sex_note_all_fallback: >-
    For a same-sex search the age gaps, the education pairings and the
    racial and ethnic pairings all come from opposite-sex couples, because
    same-sex couples in the survey are too few to measure them on their
    own.
  # the two optional "about you" inputs (m3.0.0): labels, the one-line
  # note saying why they are asked and that they are optional, the
  # unset option and the four education levels
  self_edu_label: "My education"
  self_race_label: "My race or ethnicity"
  prefer_not_to_say: "Prefer not to say"
  about_you_note: >-
    Optional: your education and your race or ethnicity feed only the
    chances-of-matching figure. Leave either unset and the average for
    people of your age and sex is used instead.
  edu_hs_or_less: "High school or less"
  edu_some_college: "Some college"
  edu_bachelors: "College degree"
  edu_graduate: "Graduate degree"
  # item 5.3/6.4: the FBI caution boxes. The rendered box appends the
  # crime_see_more link and a closing full stop, so the surface reads
  # exactly Nathan's block including its final "See more details."
  crime_caution: >-
    The FBI cautions against using this number to compare cities. Data
    can be affected by how much crime is reported and whether local
    agencies send data to the FBI at all.
  crime_see_more: "See more details"
  # kept for the record and the blank state's sibling wording; since
  # Phase 2f the per-city coverage figure renders NOWHERE on the card
  # (flagged in PHASE2F.md) — the explainer page covers coverage in prose
  crime_coverage_line: >-
    Police agencies covering {coverage} of the people here reported a full
    year of {year} data. The rates count only what those agencies cover.
  crime_blank: >-
    Not enough of {city}'s police agencies reported a full year of data
    for a figure we'd stand behind, so none is shown.
  crime_compare_note: >-
    Read each city's crime figures on their own. Different shares of each
    city's police agencies report, so the two columns aren't comparable —
    the FBI itself cautions against comparisons like that.
  crime_compare_banner: >-
    The FBI cautions against using these numbers to compare cities. Data
    can be affected by how much crime is reported and whether local
    agencies send data to the FBI at all.
  crime_card_blank: >-
    Not enough police reporting here for a figure worth showing.
  crime_card_info: "About this figure"
  # item 5.4: the shared blank state for a card or compare cell without a
  # figure. Crime keeps its own wording above — its blank is about police
  # reporting, and "not enough reliable data" would blame the wrong thing.
  card_missing: "Not enough reliable data available."
  stat_page_link: "See all cities by {name}"
  stat_page_missing: >-
    {n} of the ranked cities don't have this figure and are left off
    this list rather than shown as zero.
  stat_col_city: "City Name"
  stat_source_prefix: "Source:"
  age_range_error: "Ages run 18 to 70 here — that's the survey's own range."
  measure_people_heading: "The people"
  measure_context_heading: "Also on every city page"
  measure_crime_link: "About the crime figures"
  measure_crime_note: >-
    Crime reported per 100,000 people a year (not used to calculate city
    rankings)
  stat_sort_low: "Lowest first"
  stat_sort_high: "Highest first"
  stat_strip_label: "How the figures spread across every ranked city"
  # rent_page_note was DELETED in Phase 2g (item 1.5): HUD trims the
  # subsidised bottom of the rent distribution and adjusts to recent
  # movers, so the stabilised-tenancy drag the note described is not in
  # this measure.
  compare_default_note: >-
    These figures use the stated default search — {search}. Change
    anything on the home page and they become yours.
  # item 7: the compare landing subheading
  compare_page_subtitle: >-
    View two cities side by side. Learn how each ranks in your search,
    and see every city's stats with the differences between them.
  # item 6.3: the line under the compare table. Grey is "we don't judge
  # it" — and a measure set to Not much still carries weight, it is
  # never excluded ({a}/{b} are the two city names, left and right).
  compare_diff_legend: >-
    Green means the difference favors {a} for your search; red means it
    favors {b}. Grey means we don't judge it: population is just a fact,
    and a measure you set to "Not much" still counts toward the score —
    it just matters least to you.

# Phase 2f item 9.2: the stat pages' source lines — one display name and
# link per source_id, joined through each feature's provenance.source
# (docs/sources.md is the verified human copy these came from). Names
# carry the vintage where one belongs; rent's reads exactly as approved,
# with the vintage already in "5-Year Data".
sources:
  census_acs:
    name: "U.S. Census Bureau's American Community Survey 5-Year Data"
    url: "https://www.census.gov/programs-surveys/acs/"
  hud_fmr50:
    name: "U.S. Department of Housing and Urban Development, FY2027 50th Percentile Rent Estimates"
    url: "https://www.huduser.gov/portal/datasets/50per.html"
  bea_rpp:
    name: "Bureau of Economic Analysis Regional Price Parities, 2024"
    url: "https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area"
  census_cbp:
    name: "U.S. Census Bureau's County Business Patterns, 2023"
    url: "https://www.census.gov/programs-surveys/cbp.html"
  epa_sld:
    name: "EPA Smart Location Database v3.0, June 2021"
    url: "https://www.epa.gov/smartgrowth/smart-location-mapping"
  ghcn_daily:
    name: "NOAA's daily weather station records (GHCN-Daily), 1991–2020"
    url: "https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily"
  ipeds:
    name: "U.S. Department of Education's IPEDS college enrollment data, 2023–24"
    url: "https://nces.ed.gov/ipeds/use-the-data"
  fbi_cde:
    name: "FBI Crime Data Explorer, 2025"
    url: "https://cde.ucr.cjis.gov/"

# Phase 2f item 8.5: the What-we-measure page's composition — group ->
# ordered ids, so the page composes nothing. Cost of living shows Rent
# and Everyday prices (the two scored RPP components stay the scored
# features; only this page's presentation changes — the methodology page
# still documents that everyday prices is their average). "pillars" rows
# render pillar display fields (the two people measures); crime: true
# appends the combined crime card with strings.measure_crime_note.
measure_page:
  # m3.0.0: the two people measures are pool size and chances of matching;
  # balance stays on the page as a displayed statistic (its card body is
  # the wording the pillar carried before ADR 0009)
  - {heading: people, pillars: [pool, match], features: [pool_balance]}
  - {heading: cost, features: [rent_1br, everyday_prices]}
  - {heading: reach, features: [venues_per_100k, resident_walkability_index]}
  - {heading: students, features: [students_per_1k_adults]}
  - {heading: weather, features: [pleasant_days]}
  - {heading: context, features: [who_lives_here], crime: true}

# The one-line city description (ADR 0004): composed at build from data the
# artifact already holds — never hand-written, never a model call in this
# phase (the deferred build-time narratives replace it later). First
# matching character rule wins; the location clause names the nearest
# larger metro within reach, else the state.
city_description:
  template: "{character} of about {pop} people {location}."
  characters:
    - {rule: students_per_1k_at_least, value: 100, text: "A college town"}
    - {rule: pop_at_least, value: 5000000, text: "A vast metro area"}
    - {rule: pop_at_least, value: 1000000, text: "A major city"}
    - {rule: default, text: "A city"}
  drive_phrases:   # straight-line miles at ~50 mph, rounded to spoken time
    - {max_minutes: 40, text: "half an hour"}
    - {max_minutes: 75, text: "an hour"}
    - {max_minutes: 110, text: "an hour and a half"}
    - {max_minutes: 150, text: "two hours"}
    - {max_minutes: 185, text: "about three hours"}
  location_near: "{drive} {direction} of {city}"
  location_far: "in {state}"
  # Display-name judgments (Phase 2e): where the Census-attested place
  # name is a consolidated government's legal form, the name people use
  # wins — a registry decision, not code. (Winston-Salem is the opposite
  # case: the legal place name IS the used name, and the old title-split
  # heuristic had maimed it to "Winston".)
  display_overrides:
    - {cbsa: "30460", name: "Lexington"}      # not "Lexington-Fayette"
    - {cbsa: "31420", name: "Macon"}          # not "Macon-Bibb County"

naics_venues:                       # the reach venue selection (CBP + QCEW)
  "722511": full-service restaurants
  "722515": coffee & snack (nonalcoholic bars)
  "722410": drinking places (alcoholic beverages)
  "713940": fitness & recreational sports centers
  "712110": museums
  "512131": motion picture theaters

# Pleasant-day definition (Phase 2d item 11): computed on ACTUAL daily
# observations (GHCN-Daily 1991-2020), never on normals — averaging
# destroys the day-to-day variation this statistic counts, which is how
# San Francisco served 365. Precipitation joined the definition: a mild
# day with real rain is not a nice day. All three thresholds live here
# where they can be argued with.
pleasant_day:
  tmax_f: [55, 85]
  tmin_floor_f: 40
  prcp_max_in: 0.1

missing_data_policy: >
  A metro missing a static feature keeps its other features; the pillar's
  internal weights are renormalized over the features that metro has, and
  the metro carries a feature_flags list naming what was missing. A metro
  missing an entire pillar has that pillar's weight redistributed pro-rata
  across its remaining pillars, flagged the same way. Missing never becomes
  zero. Covered by model/tests.

features:
  - id: pool_size
    pillar: pool
    kind: extensive
    direction: 1
    weight_in_pillar: 1.0
    computed: per_request
    display_name: "People who match"
    unit: "people match what you're looking for"
    unit_short: ""
    display_decimals: 0
    mover_phrase: "the size of the pool"
    definition: >-
      The number of people in each city who match your whole search,
      counted from the Census Bureau's household survey.
    provenance: {source: census_acs, dataset: "ACS 2020-2024 5-year PUMS",
                 table: pool_cube, variables: [PWGTP, a_eff],
                 geography: cbsa, vintage: "2020-2024",
                 transform_id: cube_v1, tier: measured}

  # ADR 0004: dating pool balance is the plain sex ratio of single adults
  # in the searched age range — sought sex over seeker sex, same ages, same
  # marital selection, deliberately NOT filtered by race, education or
  # income. The name is true, the figure stays put as filters move, and no
  # assumption about who competes with whom is baked in.
  # m3.0.0 (ADR 0009): displayed everywhere it was — the tally on result
  # rows, city and compare pages, its What-we-measure row — and SCORED
  # NOWHERE: status context_only, weight 0, out of the pillar set. Its
  # computation is unchanged (scoring.rank, gated separately). The
  # definition below is the sentence its pillar card carried before.
  - id: pool_balance
    pillar: context
    kind: intensive
    direction: 1
    weight_in_pillar: 0.0
    computed: per_request
    status: context_only
    display_name: "Dating pool balance"
    unit: "per 100"
    unit_short: "per 100"
    display_scale: 100
    display_decimals: 0
    mover_phrase: "the balance"
    definition: >-
      Number of single men per 100 single women in your selected age range
      (or the opposite, if you're looking for women)
    provenance: {source: census_acs, dataset: "ACS 2020-2024 5-year PUMS",
                 table: pool_cube, variables: [PWGTP, a_eff],
                 geography: cbsa, vintage: "2020-2024",
                 transform_id: sex_ratio_v2, tier: measured}

  # m3.0.0 (ADR 0009): the match pillar's one feature. A RATE, not a
  # count — the kernel-weighted share of the visitor's own matched pool,
  # served as an index where 100 is the national average for that same
  # search (the cube summed over every metro). Weights come from the
  # assortative kernel (pipeline/build/kernel.py: age gap by seeker sex,
  # 4x4 education, 8x8 race/ethnicity by seeker sex, fitted on recent
  # couples relative to random pairing given availability, one per-metro
  # dial per component where the leave-one-metro-out test earned one).
  # Race enters on the same footing as age and education — Nathan's
  # decision, taken deliberately; the per-level sensitivity table in
  # results/phase3/ is the standing record of what each component does.
  # Suppression gates on the UNWEIGHTED n exactly as pool_size does; the
  # kernel can neither rescue nor condemn a cell. Bands are the stat's
  # position among the query's ranked set (five, registry labels).
  - id: match_propensity
    pillar: match
    kind: intensive
    direction: 1
    weight_in_pillar: 1.0
    computed: per_request
    display_name: "Chances of matching"
    unit: "where 100 is the US average"
    unit_short: "(US = 100)"
    display_decimals: 0
    mover_phrase: "your chances of matching"
    band_direction: good_high
    band_labels: ["Far below most cities", "Below most cities",
                  "About average", "Above most cities",
                  "Far above most cities"]
    definition: >-
      How closely the people who match your search resemble the people who
      actually pair with someone like you, on age, education and
      background, where 100 is the US average
    provenance: {source: census_acs, dataset: "ACS 2020-2024 5-year PUMS",
                 table: "pool_cube x kernel (person+household couple links, RELSHIPP 20<->21/22)",
                 variables: [PWGTP, a_eff, AGEP, SCHL, RAC1P, HISP, MARHYP, SERIALNO, RELSHIPP],
                 geography: cbsa, vintage: "2020-2024",
                 transform_id: match_propensity_v1, tier: measured}

  # Retired from serving in m2.0.0 (ADR 0004): pool-over-competition after
  # every filter read as a sex ratio, which it was not. Kept as history —
  # Phase 1's findings rest on it — but nothing computes it at request time.
  - id: partners_per_rival
    pillar: match
    kind: intensive
    direction: 1
    weight_in_pillar: 0.0
    computed: per_request
    status: retired
    retired_reason: >-
      Read as the city's sex ratio when it was pool-over-competition after
      every filter; replaced by pool_balance, the plain sex ratio
      (ADR 0004, m2.0.0).
    display_name: "Matches per 10 people looking"
    unit: "per 10 looking"
    unit_short: ""
    display_scale: 10
    display_decimals: 1
    definition: >-
      Retired in m2.0.0. For every 10 people looking for the same kind of
      match, how many people fit your filters.
    provenance: {source: census_acs, dataset: "ACS 2020-2024 5-year PUMS",
                 table: pool_cube, variables: [PWGTP, a_eff],
                 geography: cbsa, vintage: "2020-2024",
                 transform_id: symmetric_rivals_v1, tier: measured}

  # m2.4.0 (ADR 0008): rent comes from HUD's FY2027 50th Percentile Rent
  # Estimates — a gross rent (shelter plus tenant-paid utilities, so the
  # unit line's "with utilities" stays true), on HUD's adjusted-standard-
  # quality ACS 2020-2024 base, trended into the fiscal year. The id was
  # renamed from median_gross_rent while there is no public URL: the
  # metro figure is a renter-household-weighted mean of county medians,
  # not itself a median. Aggregation county -> metro (and county
  # subdivision -> county in New England) happens in build/features.py,
  # weighted by ACS renter-occupied households (B25003_003E).
  - id: rent_1br
    pillar: cost
    kind: intensive
    direction: -1
    weight_in_pillar: 0.5
    computed: static
    display_name: "Rent"
    unit: "median 1-bedroom monthly rent, with utilities"
    unit_short: "$/mo"
    display_decimals: 0
    mover_phrase: "rent"
    band_direction: good_low
    band_labels: ["Far cheaper than most cities", "Cheaper than most cities",
                  "About average for rent", "Pricier than most cities",
                  "Among the priciest cities"]
    definition: >-
      The typical monthly rent for a one-bedroom home across the city,
      utilities included
    provenance: {source: hud_fmr50,
                 dataset: "HUD 50th Percentile Rent Estimates, FY2027",
                 table: FY2027_FMR_50_county.xlsx, variables: [rent_50_1],
                 geography: "county -> cbsa", vintage: "FY2027",
                 transform_id: cost_rent_1br_hud_v1, tier: measured}

  # Composition decision: all-items RPP is EXCLUDED because rent is measured
  # directly by B25064 and all-items embeds a large housing-rents component —
  # using both would double-count housing. Goods + Services:Other carry the
  # non-housing price level. The two remain the SCORED features; the city
  # page displays their simple average as everyday_prices.
  - id: rpp_goods
    pillar: cost
    kind: intensive
    direction: -1
    weight_in_pillar: 0.25
    computed: static
    display_name: "Prices for goods"
    unit: "where the US average is 100"
    unit_short: "(US = 100)"
    display_decimals: 1
    mover_phrase: "everyday prices"
    definition: "Price level for goods, where the US average is 100 (BEA)."
    provenance: {source: bea_rpp, dataset: "BEA Regional Price Parities",
                 table: MARPP_MSA_2008_2024.csv, variables: ["RPPs: Goods"],
                 geography: cbsa, vintage: "2024",
                 transform_id: cost_rpp_v1, tier: measured}

  - id: rpp_services_other
    pillar: cost
    kind: intensive
    direction: -1
    weight_in_pillar: 0.25
    computed: static
    display_name: "Prices for services"
    unit: "where the US average is 100"
    unit_short: "(US = 100)"
    display_decimals: 1
    mover_phrase: "everyday prices"
    definition: >-
      Price level for services other than housing, where the US average is
      100 (BEA).
    provenance: {source: bea_rpp, dataset: "BEA Regional Price Parities",
                 table: MARPP_MSA_2008_2024.csv,
                 variables: ["RPPs: Services: Other"],
                 geography: cbsa, vintage: "2024",
                 transform_id: cost_rpp_v1, tier: measured}

  # Display-only composite for the city page's "Everyday prices" card: the
  # simple average of the two scored BEA price levels. Never scored — the
  # two components carry the cost pillar (equal weights), so the average
  # is exactly what the pillar already prices in.
  - id: everyday_prices
    pillar: context
    kind: intensive
    direction: -1
    weight_in_pillar: 0.0
    computed: static
    status: context_only
    display_name: "Everyday prices"
    unit: "where the US average is 100"
    unit_short: "(US = 100)"
    display_decimals: 0
    band_direction: good_low
    # ABSOLUTE edges, not percentile: these labels speak in US-average
    # units, and most metros price below 100 — a percentile band called a
    # 98 "above the US average", which the number itself contradicts
    # (caught on Provo's card). Same precedent as population's edges.
    band_edges: [90, 97, 103, 110]
    band_labels: ["Far below the US average", "Below the US average",
                  "About the US average", "Above the US average",
                  "Far above the US average"]
    definition: "The price of goods and services, where the US average is 100."
    provenance: {source: bea_rpp, dataset: "BEA Regional Price Parities",
                 table: MARPP_MSA_2008_2024.csv,
                 variables: ["RPPs: Goods", "RPPs: Services: Other"],
                 geography: cbsa, vintage: "2024",
                 transform_id: cost_rpp_composite_v1, tier: measured}

  - id: venues_per_100k
    pillar: reach
    kind: intensive
    direction: 1
    weight_in_pillar: 0.5
    computed: static
    display_name: "Places to go out"
    unit: "bars, cafés and venues per 100,000 adults"
    unit_short: "per 100k adults"
    display_decimals: 0
    mover_phrase: "places to go out"
    band_direction: good_high
    band_labels: ["Far fewer than most cities", "Fewer than most cities",
                  "About average", "More than most cities",
                  "Far more than most cities"]
    definition: >-
      Restaurants, coffee shops, bars, gyms, museums and movie theaters
      per 100,000 adults
    provenance: {source: census_cbp, dataset: "County Business Patterns 2023",
                 table: "CBP ESTAB by NAICS2017",
                 variables: ["722511", "722515", "722410", "713940", "712110",
                             "512131"],
                 geography: cbsa, vintage: "2023",
                 transform_id: reach_venues_v1, tier: measured}

  # Named to survive into the copy: this is walkability experienced by the
  # city's RESIDENTS (SLD block-group population), never a share of the
  # matched pool — the pool exists only at metro level.
  - id: resident_walkability_index
    pillar: reach
    kind: intensive
    direction: 1
    weight_in_pillar: 0.5
    computed: static
    display_name: "Getting around on foot"
    # item 8.4: the stat-page link reads "See all cities by walkability" —
    # "by getting around on foot" is not a sentence (population precedent)
    stat_page_name: "walkability"
    unit: "walkability, 1 to 20"
    unit_short: "on the 1–20 index"
    display_decimals: 1
    mover_phrase: "walkable neighbourhoods"
    band_direction: good_high
    band_labels: ["Among the least walkable", "Less walkable than most",
                  "About average", "More walkable than most",
                  "Among the most walkable"]
    definition: >-
      A walkability index of where the city's residents live, from 1 to 20.
    provenance: {source: epa_sld, dataset: "EPA Smart Location Database v3.0",
                 table: "SmartLocationDatabase MapServer",
                 variables: [NatWalkInd, D3B, TotPop, GEOID10],
                 geography: "block group (2010) -> cbsa",
                 vintage: "2021-06", transform_id: reach_walkability_v1,
                 tier: measured}

  # Deliberately deferred (§11 coverage-bias regression not yet built):
  # tracked TODO, not a stub returning zeros.
  - id: poi_venue_density
    pillar: reach
    kind: intensive
    direction: 1
    weight_in_pillar: 0.0
    computed: static
    status: deferred
    todo: "Overture + Foursquare POI union with CBP coverage-bias regression (§11); Phase 3+"
    display_name: "Venue density (points of interest)"
    unit: "per 100k adults"
    unit_short: ""
    definition: >-
      Deferred: a POI-based venue count awaiting the coverage-bias
      regression against Census business data. Not computed and not scored.
    provenance: {source: census_cbp, dataset: "placeholder until POI union lands",
                 table: none, variables: [], geography: cbsa, vintage: none,
                 transform_id: none, tier: measured}

  # m2.1.0 (Phase 2d item 11): computed on GHCN-Daily OBSERVATIONS, with
  # precipitation in the definition. The Phase 2a deviation to daily
  # Normals is CLOSED: normals average away the day-to-day variation this
  # statistic counts, which served San Francisco 365 nice days a year.
  - id: pleasant_days
    pillar: weather
    kind: intensive
    direction: 1
    weight_in_pillar: 1.0
    computed: static
    display_name: "Nice days a year"
    unit: "mild and dry enough to be outside"
    unit_short: ""
    display_decimals: 0
    mover_phrase: "the weather"
    band_direction: good_high
    band_labels: ["Far fewer than most cities", "Fewer than most cities",
                  "About average", "More than most cities",
                  "Far more than most cities"]
    # Phase 2g item 3: Nathan wrote "average between 55 and 85°F"; the
    # rule is on the day's HIGH (tmax_f below), so "average" would
    # describe a different statistic — "reach" ships instead, flagged in
    # PHASE2G.md for his confirmation. The 30-year clause moved to the
    # stat page's source line (NOAA GHCN-Daily, 1991–2020).
    definition: >-
      Days a year that reach between 55 and 85°F, don't dip below 40°F,
      and see no more than a light shower
    provenance: {source: ghcn_daily,
                 dataset: "NOAA GHCN-Daily",
                 table: "daily-summaries access CSVs, 1991-2020",
                 variables: [TMAX, TMIN, PRCP],
                 geography: "station -> cbsa", vintage: "1991-2020",
                 transform_id: lifestyle_pleasant_days_v2, tier: measured}

  # Direction is a documented judgment: student presence proxies a younger
  # social infrastructure. Band tones are neutral in every band — a heavy
  # student presence is a character, not a virtue (the v3 board colours it
  # neutrally too).
  - id: students_per_1k_adults
    pillar: students
    kind: intensive
    direction: 1
    weight_in_pillar: 1.0
    computed: static
    display_name: "Students"
    unit: "college students per 1,000 adults"
    unit_short: "per 1k adults"
    display_decimals: 0
    mover_phrase: "the student crowd"
    band_direction: neutral
    band_labels: ["Far fewer than most cities", "Fewer than most cities",
                  "About average", "More than most cities",
                  "Far more than most cities"]
    definition: >-
      Students enrolled at the city's colleges per 1,000 adults, not
      counting online-only enrollment
    provenance: {source: ipeds, dataset: "IPEDS 2023-24",
                 table: "HD2023 + EF2023A_DIST",
                 variables: [UNITID, CBSA, COUNTYCD, EFDELEV, EFDETOT, EFDEEXC],
                 geography: "institution -> cbsa", vintage: "2023-24",
                 transform_id: lifestyle_students_v1, tier: measured}

  # Display-only: the city page's "Who lives here" card. Size is a fact,
  # not a virtue — neutral in every band.
  - id: who_lives_here
    pillar: context
    kind: intensive
    direction: 1
    weight_in_pillar: 0.0
    computed: static
    status: context_only
    display_name: "Who lives here"
    stat_page_name: "population"
    unit: "people"
    unit_short: ""
    unit_template: "people, of whom {adults} are adults"
    display_decimals: 0
    # population bands by ABSOLUTE size, not percentile: most metros are
    # small, so quantiles would call every top-band metro "biggest" —
    # 717k Provo included, which misleads. Edges are a registry judgment.
    band_edges: [250000, 500000, 1000000, 2500000]
    band_direction: neutral
    band_labels: ["One of the smaller cities", "A modest-sized city",
                  "A mid-sized city", "A big city",
                  "One of the biggest cities"]
    definition: >-
      Everyone living in the metro area, and how many are adults aged 18
      to 70.
    provenance: {source: census_acs, dataset: "ACS 2020-2024 5-year",
                 table: "B01003 (bridged to metros)",
                 variables: [B01003_001E],
                 geography: cbsa, vintage: "2020-2024",
                 transform_id: pop_bridge_v1, tier: measured}

  # Retired from serving in m2.0.0 (ADR 0004): race and ethnicity select
  # who lives in a city and matches the search — the site says nothing
  # about who partners with whom. The couples linkage itself stays in the
  # pipeline as the foundation of Phase 3's kernel.
  - id: cross_group_pairing_rate
    pillar: context
    kind: intensive
    direction: 1
    weight_in_pillar: 0.0
    computed: static
    status: retired
    retired_reason: >-
      Race filters carry no claim about who partners with whom (ADR 0004);
      retired from serving in m2.0.0. pairing_cells.parquet and the couples
      linkage remain for Phase 3.
    display_name: "Partnered outside their group"
    unit: "% of partnered people"
    unit_short: "%"
    display_scale: 100
    display_decimals: 1
    definition: >-
      Retired in m2.0.0. Among partnered people of a group, the share whose
      spouse or partner is outside that group.
    provenance: {source: census_acs, dataset: "ACS 2020-2024 5-year PUMS",
                 table: "person+household couple links (RELSHIPP 20<->21/22/23/24)",
                 variables: [SERIALNO, RELSHIPP, RAC1P, HISP, SEX, AGEP,
                             PWGTP, PWGTP1-80],
                 geography: cbsa, vintage: "2020-2024",
                 transform_id: pairing_interim_v1, tier: measured}

  # D01: crime is never scored — context rendering only, with the FBI's
  # caution rendered beside every figure (strings.crime_caution). Built by
  # the Phase 2d adapter: agency offences -> county via ORI -> CBSA via
  # the pinned delineation; rates divide by the population the reporting
  # agencies cover, never by the metro's; coverage ships beside the rates
  # and gates rendering (crime.coverage_floor). No composite, no ranking,
  # no stat page — an explainer page instead.
  # Phase 2e item 2: the crime cards carry a five-band POSITION with
  # band_direction neutral, deliberately — colouring a low rate "good"
  # would make exactly the between-cities comparison the FBI cautions
  # against and the popover disclaims. The position is descriptive; the
  # tone stays quiet (the students precedent).
  - id: violent_crime_rate
    pillar: context
    kind: intensive
    direction: -1
    weight_in_pillar: 0.0
    computed: static
    status: context_only
    display_name: "Violent crime"
    unit: "reported per 100,000 people a year"
    unit_short: "per 100k"
    display_decimals: 0
    band_direction: neutral
    band_labels: ["Far lower than most cities", "Lower than most cities",
                  "About average", "Higher than most cities",
                  "Far higher than most cities"]
    definition: >-
      Murder, rape, robbery and aggravated assault reported to police, per
      100,000 people in the areas whose agencies reported a full year
      (FBI Crime Data Explorer).
    provenance: {source: fbi_cde, dataset: "FBI Crime Data Explorer",
                 table: "summarized agency offences (agency -> cbsa)",
                 variables: [violent-crime],
                 geography: "agency -> county -> cbsa", vintage: "2021-2025",
                 transform_id: crime_rates_v1, tier: context}

  - id: property_crime_rate
    pillar: context
    kind: intensive
    direction: -1
    weight_in_pillar: 0.0
    computed: static
    status: context_only
    display_name: "Property crime"
    unit: "reported per 100,000 people a year"
    unit_short: "per 100k"
    display_decimals: 0
    band_direction: neutral
    band_labels: ["Far lower than most cities", "Lower than most cities",
                  "About average", "Higher than most cities",
                  "Far higher than most cities"]
    definition: >-
      Burglary, larceny-theft and motor vehicle theft reported to police,
      per 100,000 people in the areas whose agencies reported a full year
      (FBI Crime Data Explorer).
    provenance: {source: fbi_cde, dataset: "FBI Crime Data Explorer",
                 table: "summarized agency offences (agency -> cbsa)",
                 variables: [property-crime],
                 geography: "agency -> county -> cbsa", vintage: "2021-2025",
                 transform_id: crime_rates_v1, tier: context}

  - id: crime_coverage
    pillar: context
    kind: intensive
    direction: 1
    weight_in_pillar: 0.0
    computed: static
    status: context_only
    display_name: "Reporting coverage"
    unit: "of people here live in areas whose police reported a full year"
    unit_short: ""
    display_scale: 100
    display_decimals: 0
    definition: >-
      The share of the metro's population living in areas whose police
      agencies reported a full year of data — the reason crime figures
      aren't comparable between cities.
    provenance: {source: fbi_cde, dataset: "FBI Crime Data Explorer",
                 table: "summarized agency offences (agency -> cbsa)",
                 variables: [violent-crime, property-crime],
                 geography: "agency -> county -> cbsa", vintage: "2021-2025",
                 transform_id: crime_rates_v1, tier: context}
