  political_lean_dem: "Democratic"
  political_lean_rep: "Republican"
  political_lean_other: "Everyone else"
  political_lean_text: "{dem} {dem_label}\u00a0· {rep} {rep_label}"
  political_lean_bar_label: "{dem_label} {dem}, {other_label} {other}, {rep_label} {rep}"
  political_lean_missing: "Not available"
  # the stat page's sort control: by name first (its default), then either
