name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Own the environment explicitly: setup-uv may already have created .venv,
      # so --clear makes this step idempotent, and the tests run through an
      # explicit interpreter rather than relying on activation semantics.
      - run: uv venv --clear --python 3.12
      - run: uv pip install -r requirements.lock
      - run: .venv/bin/python -m pytest atlas -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the e2e stack serves the pinned fixture build through the real
      # FastAPI process, so the python env is part of the web job too
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --clear --python 3.12
      - run: uv pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas/web/package-lock.json
      - run: npm ci
        working-directory: atlas/web
      # the shared permalink test (acceptance gate 5): TS decode/encode
      # against cases the Python model emitted
      - run: npm test
        working-directory: atlas/web
      - run: npx playwright install --with-deps chromium
        working-directory: atlas/web
      - run: npx playwright test
        working-directory: atlas/web
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: atlas/web/test-results/
          retention-days: 7
