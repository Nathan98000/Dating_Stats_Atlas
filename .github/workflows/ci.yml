name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Own the environment explicitly: setup-uv may already have created .venv,
      # so --clear makes this step idempotent, and the tests run through an
      # explicit interpreter rather than relying on activation semantics.
      - run: uv venv --clear --python 3.12
      - run: uv pip install -r requirements.lock
      - run: .venv/bin/python -m pytest atlas -q
